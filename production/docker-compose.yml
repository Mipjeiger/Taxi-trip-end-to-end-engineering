
services:
  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s 
      timeout: 5s
      retries: 5
    networks:
      - taxi_trip_network

  # RedisInsight for UI redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # MLflow for experiment tracking and model management
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri file:///mlflow/tracking
      --default-artifact-root file:///mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - taxi_trip_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PostgreSQL connection for Metabase configuration
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_database:/var/lib/postgresql/data
      - ./backend/sql/init_analytics.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped 

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./.env
    environment:
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATA_SOURCE_PATH: ${DATA_SOURCE_PATH}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_CLUSTER_URL: ${QDRANT_CLUSTER_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Frontend React app service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taxi_trip_network
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - REACT_APP_API_URL=${REACT_APP_API_URL}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Metabase - for UI postgresql to visualize data and create dashboards
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "4001:4001"   
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_trip_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Grafana for visualization metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Apache Airflow - Data Orchestration and Workflow Management
  # Airflow database
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow_db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}", "-d", "${AIRFLOW_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Airflow webserver UI
  airflow-webserver:
    build:
      context: ./backend/airflow
      dockerfile: Dockerfile  
    container_name: airflow_webserver
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__MAX_MAP_LENGTH: 2048
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__DAG_CONCURRENCY: 4
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW__SCHEDULER__MAX_THREADS: 2
      AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_PARSE_PER_LOOP: 100
      AIRFLOW_CONN_SUPABASE_DEFAULT: ${AIRFLOW_CONN_SUPABASE_DEFAULT}
      GUNICORN_CMD_ARGS: "--workers 2 --worker-class sync --max-requests 1000 --max-requests-jitter 50 --timeout 60"
      # Supabase credentials
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      # PostgreSQL connection for Airflow metadata database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      PARQUET_PATH: ${PARQUET_PATH}
      TEMP_DIR: /tmp/airflow_taxi_pipeline
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/plugins:/opt/airflow/plugins
      - ./backend/airflow/config:/opt/airflow/config
      - ./backend/database:/opt/airflow/database
      - airflow_logs_volume:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && airflow webserver"
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Airflow scheduler
  airflow-scheduler:
    build:
      context: ./backend/airflow
      dockerfile: Dockerfile
    container_name: airflow_scheduler
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__MAX_MAP_LENGTH: 2048
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__SCHEDULER__MAX_THREADS: 1
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 300
      AIRFLOW__SCHEDULER__PROCESSOR_POLL_INTERVAL: 1
      AIRFLOW_CONN_SUPABASE_DEFAULT: ${AIRFLOW_CONN_SUPABASE_DEFAULT}
      # Supabase credentials
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      # PostgreSQL connection for Airflow metadata database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      PARQUET_PATH: ${PARQUET_PATH}
      TEMP_DIR: /tmp/airflow_taxi_pipeline
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/plugins:/opt/airflow/plugins
      - ./backend/airflow/config:/opt/airflow/config
      - ./backend/database:/opt/airflow/database
      - airflow_logs_volume:/opt/airflow/logs
    command: bash -c "airflow db migrate && airflow scheduler"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Apache kafka - Event streaming for frontend interactions and real-time features
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOO_CFG_EXTRA: "dataDir=/var/lib/zookeeper/data"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Only use internal port for inter-broker communication and external port for host access to avoid confusion
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ⚡ ULTRA-AGGRESSIVE offset cleanup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_RETENTION_MINUTES: 60  # Only 1 hour (was 24)
      KAFKA_OFFSETS_RETENTION_CHECK_INTERVAL_MS: 30000  # Check every 30s (was 60s)

      # ✅ Auto-create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      
      # ⚡ ULTRA-AGGRESSIVE log retention cleanup
      KAFKA_LOG_RETENTION_HOURS: 6  # Only 6 hours (was 24)
      KAFKA_LOG_RETENTION_BYTES: 52428800  # 50MB max per topic (was 100MB)
      KAFKA_LOG_SEGMENT_BYTES: 5242880    # 5MB segments - triggers cleanup faster (was 10MB)
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANUP_DELAY_MS: 30000  # Cleanup every 30 seconds (was 60s)
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000  # Check every 30s (was 60s)
      
      # ⚡ Compact and cleanup __consumer_offsets aggressively
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_LOG_CLEANER_MIN_CLEAN_RATIO: 0.1  # Start cleanup at 10% (more aggressive)
      KAFKA_LOG_CLEANER_BACKOFF_MS: 15000  # Run every 15s (more frequent)
      
      # ✅ Memory settings - optimized for cleanup operations
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+DisableExplicitGC -XX:MaxMetaspaceSize=96m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092" # Port internal for host machine access
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092> /dev/null 2>&1"]  # simpler — just check port open
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  # Kafka UI - Monitoring kafka topics and messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: taxi-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # User INTERNAL port for inter-container
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Evidently AI for LLM Audit and Monitoring
  evidently-ui:
    build:
      context: ./backend
      dockerfile: Dockerfile.evidently
    container_name: evidently
    ports:
      - "8085:8085"
    volumes:
      - ./backend/evidently:/app/evidently
      - evidently_data:/home/user/.evidently
    environment:
      EVIDENTLY_WORKSPACE: /app/evidently
      EVIDENTLY_PORT: 8085
      EVIDENTLY_HOST: 0.0.0.0
    depends_on:
      - backend
    networks:
      - taxi_trip_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Qdrant vector database for LLM embeddings storage
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_database:
  redis_data:
  redisinsight_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
  metabase_data:
  airflow_db_data:
  airflow_logs_volume:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  evidently_data:
  qdrant_data:
networks:
  taxi_trip_network:
    driver: bridge