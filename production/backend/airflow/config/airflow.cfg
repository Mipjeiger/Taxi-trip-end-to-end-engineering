# ============================================================
# AIRFLOW CORE CONFIGURATION
# ============================================================
[core]
# Airflow home directory
airflow_home = /opt/airflow

# DAGs and plugins folders
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
base_log_folder = /opt/airflow/logs

# Executor type (LocalExecutor is memory efficient)
executor = LocalExecutor

# Database connection
sql_alchemy_conn = postgresql://airflow:airflow@airflow-db:5432/airflow

# ============================================================
# MEMORY OPTIMIZATION SETTINGS
# ============================================================
# Parallelism settings (REDUCED for memory safety)
parallelism = 4
max_active_tasks_per_dag = 2
max_active_runs_per_dag = 1
dag_concurrency = 2
max_tasks_per_dagrun = 100

# Connection pool settings (CRITICAL for memory safety)
sql_alchemy_pool_size = 5
sql_alchemy_pool_recycle = 3600
sql_alchemy_pool_pre_ping = True
sql_alchemy_max_overflow = 10
sql_alchemy_echo = False

# DAG parsing optimization
max_map_length = 2048
dag_file_processor_timeout = 50

# ============================================================
# WEBSERVER CONFIGURATION
# ============================================================
[webserver]
# Webserver host and port
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080

# Memory-safe webserver settings
workers = 2
worker_class = sync
worker_refresh_interval = 30
web_server_worker_timeout = 60
expose_config = False

# Enable RBAC
rbac_user_registration_role = Public
session_lifetime_config = 1800

# ============================================================
# SCHEDULER CONFIGURATION
# ============================================================
[scheduler]
# Scheduler optimization
dag_dir_list_interval = 300
max_dagruns_to_create_per_loop = 10
max_dagruns_to_parse_per_loop = 100
sla_check_interval = 300
catchup_by_default = False

# Memory-safe scheduler settings
scheduler_heartbeat_sec = 5
max_threads = 2
processor_poll_interval = 1
dag_file_processor_timeout = 50

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
[logging]
base_log_folder = /opt/airflow/logs
log_level = INFO
log_format = [%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s

# ============================================================
# SECURITY CONFIGURATION
# ============================================================
[security]
# Using environment variables for secrets
secret_key_cmd = echo ${AIRFLOW__WEBSERVER__SECRET_KEY}
fernet_key_cmd = echo ${AIRFLOW__CORE__FERNET_KEY}

# ============================================================
# DATABASE OPTIMIZATION
# ============================================================
[database]
sql_alchemy_conn = postgresql://airflow:airflow@airflow-db:5432/airflow
sql_alchemy_pool_size = 5
sql_alchemy_pool_recycle = 3600
sql_alchemy_pool_pre_ping = True
sql_alchemy_max_overflow = 10
sql_alchemy_echo = False
echo_pool = False

# ============================================================
# CONNECTIONS FOR SUPABASE
# ============================================================
[connections]
supabase_default = postgresql://${SUPABASE_USER}:${SUPABASE_PASSWORD}@${SUPABASE_HOST}:${SUPABASE_PORT}/${SUPABASE_DB}