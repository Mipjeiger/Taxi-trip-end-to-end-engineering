# ============================================================
# AIRFLOW CORE CONFIGURATION
# ============================================================
[core]
# Airflow home directory
airflow_home = /app/airflow

# DAGs and plugins folders
dags_folder = /app/airflow/dags
plugins_folder = /app/airflow/plugins
base_log_folder = /app/airflow/logs

# Executor type
executor = LocalExecutor

# Database
sql_alchemy_conn = postgresql://airflow:airflow@airflow-db:5432/airflow

# Parallelism settings
parallelism = 32
max_active_tasks_per_dag = 16
max_active_runs_per_dag = 2

# DAG concurrency
dag_concurrency = 16

# Task concurrency
max_tasks_per_dagrun = 10000

# ============================================================
# SUPABASE CONNECTION FOR DATA INGESTION
# ============================================================
[database]
# Primary Airflow DB
sql_alchemy_conn = postgresql://airflow:airflow@airflow-db:5432/airflow
sql_alchemy_pool_size = 5
sql_alchemy_pool_recycle = 3600

# ============================================================
# WEBSERVER CONFIGURATION
# ============================================================
[webserver]
# Webserver host and port
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080

# Expose config for debugging
expose_config = true

# Enable RBAC (Role-Based Access Control)
rbac_user_registration_role = Public

# Session timeout (in seconds)
session_lifetime_config = 1800

# ============================================================
# SCHEDULER CONFIGURATION
# ============================================================
[scheduler]
# How often to scan the DAG folder
dag_dir_list_interval = 300

# Number of times to try to schedule each DAG file
max_dagruns_to_create_per_loop = 10

# How often to check for SLA misses
sla_check_interval = 300

# Enable scheduler to catch up
catchup_by_default = False

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
[logging]
base_log_folder = /app/airflow/logs
log_level = INFO
log_format = [%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s

# ============================================================
# SECURITY CONFIGURATION
# ============================================================
[security]
secret_key = ${AIRFLOW__WEBSERVER__SECRET_KEY} # Secret key for Flask session
fernet_key = ${AIRFLOW__CORE__FERNET_KEY} # Fernet key for encrypting sensitive data

# ============================================================
# AIRFLOW CONNECTIONS FOR SUPABASE
# ============================================================
[connections]
# Supabase PostgreSQL Connection
# Format: postgresql://user:password@host:port/database
supabase_default = postgresql://${SUPABASE_USER}:${SUPABASE_PASSWORD}@${SUPABASE_HOST}:${SUPABASE_PORT}/${SUPABASE_DB}

# ============================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# ============================================================
[development]
# Development settings
parallelism = 8
max_active_tasks_per_dag = 4

[production]
# Production settings
parallelism = 32
max_active_tasks_per_dag = 16