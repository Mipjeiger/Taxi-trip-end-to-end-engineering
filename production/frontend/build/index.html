<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A1128"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="RSI"/>
  <meta name="description" content="RSI – Ride Safety Intelligence. Book your ride, track drivers in real-time, powered by smart AI"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dy='.3em'>⚡</text></svg>"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>RSI – Ride Safety Intelligence</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    #root {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .split-section {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .split-section:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
    @media (max-width: 768px) {
      #root {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .split-section:first-child {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
    }
    @supports (padding:max(0px)){
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
        padding-top: max(0px, env(safe-area-inset-top));
        padding-bottom: max(0px, env(safe-area-inset-bottom));
      }
    }
  </style>
  <script defer="defer" src="/static/js/main.0e21102a.js"></script>
  <link href="/static/css/main.595aaa35.css" rel="stylesheet">
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="split-section"></div>
    <div class="split-section"></div>
  </div>
</body>
</html>
