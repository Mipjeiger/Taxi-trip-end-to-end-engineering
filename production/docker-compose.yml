version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: taxi_trip_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi_trip_network

    # Redis for caching and real-time features
    redis:
      image: redis:7-alpine
      container_name: taxi_trip_redis
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - taxi_trip_network

      # Backend FastAPI service
      backend:
        build:
          context: ./backend
          dockerfile: Dockerfile
        container_name: taxi_trip_backend
        environment:
          DATABASE_URL: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)
          REDIS_URL: redis://redis:6379
          CORS_ORIGINS: '["http://localhost:3001"]'
        ports:
          - "8000:8000"
        volumes:
          - ./backend/models:/app/models:ro
        depends_on:
          postgres:
            condition: service_healthy
          redis:
            condition: service_healthy
        networks:
          - taxi_trip_network
        restart: unless-stopped

      # Prometheus for monitoring
      prometheus:
        image: prom/prometheus:latest
        container_name: taxi_trip_prometheus
        ports:
          - "9090:9090"
        volumes:
          - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
          - prometheus_data:/prometheus
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
        networks:
          - taxi_trip_network
        restart: unless-stopped

      # Grafana for visualization metrics
      grafana:
        image: grafana/grafana:latest
        container_name: taxi_trip_grafana
        ports:
          - "3000:3000"
        volumes:
          - grafana_data:/var/lib/grafana
          - ./grafana/provisioning:/etc/grafana/provisioning
        environment:
          - GF_SECURITY_ADMIN_PASSWORD: admin
          - GF_INSTALL_PLUGINS: grafana-piechart-panel
        depends_on:
          - prometheus
        networks:
          - taxi_trip_network
        restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  taxi_trip_network:
    driver: bridge