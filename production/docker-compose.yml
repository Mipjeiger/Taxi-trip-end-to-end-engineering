
services:
  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    container_name: taxi_trip_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s 
      timeout: 5s
      retries: 5
    networks:
      - taxi_trip_network

  # RedisInsight for UI redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: taxi_trip_redisinsight
    ports:
      - "5540:5540"
    environment:
      - REDIS_HOST=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # MLflow for experiment tracking and model management
  mlflow:
    image: python:3.11-slim
    container_name: taxi_trip_mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      bash -c "
      pip install --no-cache-dir mlflow==2.10.2 &&
      mkdir -p /mlflow/tracking /mlflow/artifacts &&
      mlflow server
      --backend-store-uri file:///mlflow/tracking
      --default-artifact-root file:///mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --app-name basic-auth
      "
    networks:
      - taxi_trip_network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxi_trip_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./.env
    environment:
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Frontend React app service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxi_trip_frontend
    ports:
      - "4002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taxi_trip_network
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - REACT_APP_API_URL=${REACT_APP_API_URL}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: taxi_trip_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Grafana for visualization metrics
  grafana:
    image: grafana/grafana:latest
    container_name: taxi_trip_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - taxi_trip_network
    restart: unless-stopped

  # Apache Airflow - Data Orchestration and Workflow Management
  # Airflow database
  airflow-db:
    image: postgres:15-alpine
    container_name: taxi_trip_airflow_db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}", "-d", "${AIRFLOW_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Airflow webserver UI
  airflow-webserver:
    build:
      context: ./backend/airflow
      dockerfile: Dockerfile  
    container_name: taxi_trip_airflow_webserver
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__MAX_MAP_LENGTH: 2048
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__DAG_CONCURRENCY: 4
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW__SCHEDULER__MAX_THREADS: 2
      AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_PARSE_PER_LOOP: 100
      AIRFLOW_CONN_SUPABASE_DEFAULT: ${AIRFLOW_CONN_SUPABASE_DEFAULT}
      GUNICORN_CMD_ARGS: "--workers 2 --worker-class sync --max-requests 1000 --max-requests-jitter 50 --timeout 60"
      # Supabase credentials
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      # Databricks credentials
      DATABRICKS_HOST: ${DATABRICKS_HOST}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/plugins:/opt/airflow/plugins
      - ./backend/airflow/config:/opt/airflow/config
      - airflow_logs_volume:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && airflow webserver"
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Airflow scheduler
  airflow-scheduler:
    build:
      context: ./backend/airflow
      dockerfile: Dockerfile
    container_name: taxi_trip_airflow_scheduler
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__MAX_MAP_LENGTH: 2048
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__SCHEDULER__MAX_THREADS: 1
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 300
      AIRFLOW__SCHEDULER__PROCESSOR_POLL_INTERVAL: 1
      AIRFLOW_CONN_SUPABASE_DEFAULT: ${AIRFLOW_CONN_SUPABASE_DEFAULT}
      # Supabase credentials
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT}
      SUPABASE_DB: ${SUPABASE_DB}
      SUPABASE_USER: ${SUPABASE_USER}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      # Databricks credentials
      DATABRICKS_HOST: ${DATABRICKS_HOST}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/plugins:/opt/airflow/plugins
      - ./backend/airflow/config:/opt/airflow/config
      - airflow_logs_volume:/opt/airflow/logs
    command: bash -c "airflow db migrate && airflow scheduler"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - taxi_trip_network
    restart: unless-stopped

    # Apache kafka - Event streaming for frontend interactions and real-time features
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: taxi_trip_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - taxi_trip_network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: taxi_trip_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - taxi_trip_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-version.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka UI - Monitoring kafka topics and messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: taxi_trip_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    networks:
      - taxi_trip_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
  airflow_db_data:
  airflow_logs_volume:
  zookeeper_data:
  kafka_data:

networks:
  taxi_trip_network:
    driver: bridge